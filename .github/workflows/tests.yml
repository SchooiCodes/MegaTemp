name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest cryptography requests
          # mega.py pins tenacity 5.x which crashes on modern Python; force a
          # compatible version after installing (see build.yml).
          pip install 'tenacity>=9.0.0' --upgrade --force-reinstall 2>/dev/null || true
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
